services:
  backend:
    image: ghcr.io/growthquantix/tradingbot:latest
    restart: always
    ports:
      - "${PORT:-8080}:8000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://trading_user:trading_password@db:5432/trading_db
      - REDIS_HOST=redis
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TORCH_NUM_THREADS=1
    depends_on:
      - db
      - redis
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 8192M
        reservations:
          cpus: '0.20'
          memory: 1024M

  db:
    image: postgres:13-alpine
    restart: always
    environment:
      - POSTGRES_USER=trading_user
      - POSTGRES_PASSWORD=trading_password
      - POSTGRES_DB=trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  redis:
    image: redis:6-alpine
    restart: always
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M

volumes:
  postgres_data:

networks:
  trading-network:
    driver: bridge

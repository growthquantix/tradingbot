version: '3.8'

services:
  backend:
    image: ghcr.io/growthquantix/tradingbot:latest
    restart: always
    ports:
      - "${PORT:-8002}:8000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://trading_user:trading_password@db:5432/trading_db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '2.50'
          memory: 8192M
        reservations:
          cpus: '0.25'
          memory: 512M

  db:
    image: postgres:13-alpine
    restart: always
    environment:
      - POSTGRES_USER=trading_user
      - POSTGRES_PASSWORD=trading_password
      - POSTGRES_DB=trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
        reservations:
          cpus: '0.10'
          memory: 256M

  redis:
    image: redis:6-alpine
    restart: always
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 64M

volumes:
  postgres_data:

networks:
  trading-network:
    driver: bridge

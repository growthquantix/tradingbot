name: 🚀 Auto-Deploy to Oracle Cloud

on:
  push:
    branches: [ main, feature-branch ]
  workflow_dispatch:  # Allows clicking "Run workflow" manually inside GitHub Actions UI

jobs:
  deploy-to-oracle:
    name: ☁️ Deploy Trading Backend to Oracle Cloud VPS
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Execute One-Click Deployment via SSH on Oracle VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🌟 GitHub Actions: Starting Auto-Deployment on Oracle VPS"
            echo "=========================================================="
            
            # Locate exact repository path on Oracle disk
            REPO_DIR=""
            if [ -d "/Work/P/app/tradingapp-main/tradingapp-main" ]; then
              REPO_DIR="/Work/P/app/tradingapp-main/tradingapp-main"
            elif [ -d "$HOME/tradingapp-main/tradingapp-main" ]; then
              REPO_DIR="$HOME/tradingapp-main/tradingapp-main"
            elif [ -d "$HOME/tradingapp-main" ]; then
              REPO_DIR="$HOME/tradingapp-main"
            else
              echo "❌ Error: Could not find tradingapp-main directory on your Oracle server!"
              echo "Please clone your repo onto your Oracle VPS first."
              exit 1
            fi
            
            echo "📂 Navigating to repository at: $REPO_DIR"
            cd "$REPO_DIR"
            
            echo "📥 Pulling latest branch changes from GitHub..."
            git fetch --all
            # Pull whatever branch is currently checked out on the server
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git reset --hard origin/$CURRENT_BRANCH || git pull origin $CURRENT_BRANCH || git pull origin main || git pull origin feature-branch
            
            echo "🚀 Running one-click setup script..."
            bash setup_oracle_cloud.sh
            
            echo "=========================================================="
            echo "🎉 GitHub Actions: Auto-Deployment completed successfully!"
            echo "=========================================================="

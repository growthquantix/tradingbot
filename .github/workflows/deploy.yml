name: Oracle Cloud & Netlify CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Validate Code & Build Docker Image on GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python for Syntax Validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile app.py
          echo "✅ Code syntax validation passed!"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/growthquantix/tradingbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-oracle:
    name: Fast Deploy & Verify Health on Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH, Deploy & Validate Live Backend Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================================="
            echo "🚀 Deploying Pre-Built TradingBot Container to Oracle Cloud"
            echo "=========================================================="
            cd ~/tradingbot || git clone https://github.com/growthquantix/tradingbot.git ~/tradingbot && cd ~/tradingbot
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
            
            echo "⏳ Waiting 10 seconds for backend health check..."
            sleep 10
            
            HEALTH_RESPONSE=$(curl -s http://localhost:8080/health || echo "FAILED")
            echo "🧪 Live Health Check Result: $HEALTH_RESPONSE"
            
            if [[ "$HEALTH_RESPONSE" == *"healthy"* ]]; then
              echo "=========================================================="
              echo "🎉 SUCCESS: TradingBot is LIVE 24/7 & HEALTHY!"
              echo "=========================================================="
            else
              echo "=========================================================="
              echo "❌ ERROR: Health check failed! Printing backend logs:"
              echo "=========================================================="
              sudo docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi

name: Oracle Cloud & Netlify CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Docker Image on GitHub & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/growthquantix/tradingbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-oracle:
    name: Fast Deploy Pre-Built Image to Oracle Cloud (0% Server CPU)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH & Deploy Pre-Built Container to Oracle Cloud Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================================="
            echo "🚀 Deploying Pre-Built TradingBot Container to Oracle Cloud"
            echo "=========================================================="
            cd ~/tradingbot || git clone https://github.com/growthquantix/tradingbot.git ~/tradingbot && cd ~/tradingbot
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
            
            echo "⏳ Waiting 5 seconds for backend health check..."
            sleep 5
            
            echo "🧪 Verifying Backend Live Health Status:"
            curl -s http://localhost:8080/health || echo "⚠️ Backend initializing..."
            echo ""
            echo "=========================================================="
            echo "🎉 Auto-Deployment Complete & Backend Healthy!"
            echo "=========================================================="

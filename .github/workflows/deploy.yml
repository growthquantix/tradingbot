name: Oracle Cloud & Netlify CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Validate Code, Dry-Run Container & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python for Production Validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile app.py
          echo "✅ Code syntax validation passed!"

      - name: Audit All 20+ Routers & Third-Party Dependencies
        env:
          DATABASE_URL: postgresql://trading_user:trading_password@localhost:5432/trading_db
          JWT_SECRET_KEY: test-ci-secret-key-32-chars-long
          SECRET_KEY: test-ci-secret-key-32-chars-long
        run: |
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          python -c "import app; print('==========================================================\n✅ ENTERPRISE AUDIT PASSED: All 20+ routers and dependencies imported cleanly with 0 errors!\n==========================================================')"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally for Dry-Run Validation
        run: |
          docker build -t tradingbot-test:latest .
          echo "✅ Docker image compiled cleanly on GitHub Cloud runner!"

      - name: Perform Container Runtime Dry-Run Test
        run: |
          docker run --rm -e DATABASE_URL=postgresql://trading_user:trading_password@localhost:5432/trading_db tradingbot-test:latest python -c "import app; print('==========================================================\n✅ CONTAINER RUNTIME DRY-RUN PASSED: Container runtime environment and code execution 100% verified!\n==========================================================')"

      - name: Build and Push Final Verified Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/growthquantix/tradingbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-oracle:
    name: Fast Deploy & Verify Health on Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH, Deploy & Validate Live Backend Health
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.ORACLE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================================="
            echo "🚀 Deploying Pre-Built TradingBot Container to Oracle Cloud"
            echo "=========================================================="
            cd ~/tradingbot || git clone https://github.com/growthquantix/tradingbot.git ~/tradingbot && cd ~/tradingbot
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
            
            echo "⏳ Waiting for backend health check (up to 30 seconds)..."
            HEALTH_PASSED=false
            for i in {1..6}; do
              sleep 5
              HEALTH_RESPONSE=$(curl -s http://localhost:8080/health || echo "CONNECT_FAILED")
              echo "🧪 Health Check Attempt $i/6: $HEALTH_RESPONSE"
              if [[ "$HEALTH_RESPONSE" == *"healthy"* ]]; then
                HEALTH_PASSED=true
                break
              fi
            done
            
            if [ "$HEALTH_PASSED" = true ]; then
              echo "=========================================================="
              echo "🎉 SUCCESS: TradingBot is LIVE 24/7 & HEALTHY!"
              echo "=========================================================="
              
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  -d "text=🚀 *TradingBot Auto-Deployed Successfully!*%0A%0A*Commit*: \`$(git rev-parse --short HEAD)\`%0A*Status*: HEALTHY 🟢%0A*Endpoint*: https://141.148.198.8.nip.io/health" \
                  -d "parse_mode=Markdown" || true
              fi
            else
              echo "=========================================================="
              echo "❌ ERROR: Health check failed! Printing backend logs:"
              echo "=========================================================="
              sudo docker compose -f docker-compose.prod.yml logs --tail=100 backend
              
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  -d "text=🚨 *TradingBot Auto-Deployment FAILED!*%0A%0A*Commit*: \`$(git rev-parse --short HEAD)\`%0A*Status*: UNHEALTHY 🔴" \
                  -d "parse_mode=Markdown" || true
              fi
              
              exit 1
            fi

name: Frontend CI/CD Pipeline (Netlify)

on:
  push:
    branches: ["main"]
    paths:
      - 'ui/trading-bot-ui/**'
      - '.github/workflows/node.js.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Validate React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/trading-bot-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/trading-bot-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Production Bundle
        env:
          GENERATE_SOURCEMAP: false
          CI: false
          REACT_APP_API_URL: https://141.148.198.8.nip.io
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: ui/trading-bot-ui/build/
          retention-days: 7
